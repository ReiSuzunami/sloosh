[package]
name = "sloosh-windows-approval"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[[bin]]
name = "sloosh-approval"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3.2"
zeroize = { version = "1.9.0", features = ["derive"] }
