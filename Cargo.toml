[package]
name = "sloosh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "sloosh"
description = "SSH-in-the-loop: persistent remote shells + human-approved credential access for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReiSuzunami/sloosh"
readme = "README.md"
keywords = ["ssh", "agent", "cli", "daemon", "remote"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.en.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/deny.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/manual.md",
    "/docs/manual.zh-CN.md",
    "/docs/getting-started/**",
    "/docs/internals/architecture.md",
    "/docs/internals/protocol.md",
    "/skills/sloosh/**",
    "/src/**",
    "/tests/**",
]

[features]
integration-test-hooks = []

[dependencies]
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
rand = "0.9"
rpassword = "7.5.4"
russh = "0.62"
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.0", features = ["derive"] }
