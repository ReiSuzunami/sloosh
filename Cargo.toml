[package]
name = "sloosh"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
default-run = "sloosh"
description = "SSH-in-the-loop: persistent remote shells + human-approved credential access for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReiSuzunami/sloosh"
readme = "README.md"
keywords = ["ssh", "agent", "cli", "daemon", "remote"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.en.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/deny.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/manual.md",
    "/docs/manual.zh-CN.md",
    "/docs/getting-started/**",
    "/docs/internals/architecture.md",
    "/docs/internals/protocol.md",
    "/skills/sloosh/**",
    "/src/**",
    "/tests/**",
    "/vendor/pageant-0.2.0/**",
]

[features]
integration-test-hooks = []

[dependencies]
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
rand = "0.9"
rpassword = "7.5.4"
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
russh = "0.62"

[target.'cfg(windows)'.dependencies]
# aws-lc's Windows build requires external NASM/CMake tooling. Keep the
# existing backend on released Unix platforms while using russh's supported
# pure Cargo/MSVC-friendly backend for the Windows package.
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
windows = { version = "0.62.2", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
# pageant 0.2.x declares Rust 1.85 but uses let-chains stabilized later.
# Keep russh's Windows agent support while carrying the minimal MSRV fix.
pageant = { path = "vendor/pageant-0.2.0" }
