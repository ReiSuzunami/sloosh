name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  preflight:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify tag, version, and branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be v<semver>: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "sloosh") | .version'
          )"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "tag $version does not match Cargo.toml $manifest_version" >&2
            exit 1
          fi

          git rev-parse --verify origin/main >/dev/null
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Check MSRV
        run: cargo +1.85.0 check --all-targets --all-features --locked

      - name: Verify source package
        run: cargo publish --dry-run --locked

      - name: Check whitespace
        run: git show --check --format= "$GITHUB_SHA"

  macos-arm64:
    name: Build macOS arm64
    needs: preflight
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Test natively
        run: cargo test --all-targets --all-features --locked --target aarch64-apple-darwin

      - name: Build release slice
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Smoke test
        run: |
          test "$(target/aarch64-apple-darwin/release/sloosh --version)" = \
            "sloosh ${{ needs.preflight.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-slice
          path: target/aarch64-apple-darwin/release/sloosh
          if-no-files-found: error
          retention-days: 1

  macos-x86_64:
    name: Build macOS x86_64
    needs: preflight
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          target: x86_64-apple-darwin

      - name: Test natively
        run: cargo test --all-targets --all-features --locked --target x86_64-apple-darwin

      - name: Build release slice
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Smoke test
        run: |
          test "$(target/x86_64-apple-darwin/release/sloosh --version)" = \
            "sloosh ${{ needs.preflight.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-x86_64-slice
          path: target/x86_64-apple-darwin/release/sloosh
          if-no-files-found: error
          retention-days: 1

  linux-x86_64-musl:
    name: Build Linux x86_64 musl
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Test musl target
        run: cargo test --all-targets --all-features --locked --target x86_64-unknown-linux-musl

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static binary
        shell: bash
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/sloosh
          test "$("$binary" --version)" = "sloosh ${{ needs.preflight.outputs.version }}"
          file "$binary" | grep -Eq 'static|statically linked'
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "release binary unexpectedly has an ELF interpreter" >&2
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          package="sloosh-$version-linux-x86_64-musl"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p "dist/root/$package"
          install -m 0755 target/x86_64-unknown-linux-musl/release/sloosh \
            "dist/root/$package/sloosh"
          install -m 0644 README.md LICENSE-APACHE LICENSE-MIT \
            "dist/root/$package/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$source_date_epoch" -C dist/root -cf - "$package" |
            gzip -n > dist/sloosh-linux-x86_64-musl.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-x86_64-musl
          path: dist/sloosh-linux-x86_64-musl.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Assemble macOS universal binary
    needs: [preflight, macos-arm64, macos-x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64-slice
          path: slices/arm64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-x86_64-slice
          path: slices/x86_64

      - name: Assemble, sign, and package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          package="sloosh-$version-macos-universal"
          mkdir -p "dist/root/$package"
          lipo -create slices/arm64/sloosh slices/x86_64/sloosh \
            -output "dist/root/$package/sloosh"
          chmod 0755 "dist/root/$package/sloosh"
          codesign --force --sign - --timestamp=none "dist/root/$package/sloosh"
          codesign --verify --strict "dist/root/$package/sloosh"
          archs="$(lipo -archs "dist/root/$package/sloosh")"
          [[ " $archs " == *" arm64 "* ]]
          [[ " $archs " == *" x86_64 "* ]]
          test "$("dist/root/$package/sloosh" --version)" = "sloosh $version"
          install -m 0644 README.md LICENSE-APACHE LICENSE-MIT \
            "dist/root/$package/"
          tar -C dist/root -czf dist/sloosh-macos-universal.tar.gz "$package"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-universal
          path: dist/sloosh-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [preflight, linux-x86_64-musl, macos-universal]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "sloosh $VERSION" \
              --repo "$GITHUB_REPOSITORY"
          fi
