[package]
name = "sloosh-desktop"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "Sloosh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sloosh = { version = "=0.2.2", path = "../.." }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSWorkspace", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSNotification", "NSOperation", "NSString", "block2"] }

[patch.crates-io]
pageant = { path = "../../vendor/pageant-0.2.0" }
